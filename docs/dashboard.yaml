    - type: tile
      entity: sensor.apex_total_power
      name: Power
    - type: tile
      entity: sensor.apex_total_current
      name: Current
    - type: tile
      entity: sensor.apex_total_energy
      name: Energy
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.apex_power_failed
      name: Last power failure
    - type: tile
      entity: sensor.apex_power_restored
      name: Power restored
    - type: heading
      heading: Inputs
      heading_style: subtitle
    - type: tile
      entity: binary_sensor.apex_swx3_1
      name: Swx3_1
    - type: tile
      entity: binary_sensor.apex_swx3_2
      name: Swx3_2
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Trends
      icon: mdi:chart-line
    - type: history-graph
      title: Temperature
      hours_to_show: 24
      entities:
      - entity: sensor.apex_temp
        name: Temp
      - entity: sensor.apex_temp_2
        name: Temp 2
      grid_options:
        columns: 12
        rows: 5
    - type: history-graph
