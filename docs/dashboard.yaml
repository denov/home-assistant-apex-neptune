        name: Salinity
      - entity: sensor.apex_salinity_2
        name: Salinity 2
      grid_options:
        columns: 12
        rows: 5
    - type: history-graph
      title: Alkalinity, 7 days
      hours_to_show: 168
      entities:
      - entity: sensor.apex_alkalinity
        name: Alk
      grid_options:
        columns: 12
        rows: 5
  - type: grid
    column_span: 2
    cards:
