# Example Apex dashboard: the one in the README screenshot (docs/dashboard.png).
# The integration doesn't create a dashboard; this is a starting point to make your own.
#
# To use it: Settings > Dashboards > Add dashboard > New dashboard from scratch, open it,
# then Edit dashboard > ⋮ > Raw configuration editor, and paste this file.
#
# Entity IDs are what a new install gets for one particular Apex. Yours depend on your probes,
# modules and output names: change the cards that show as unavailable to your entities
# (Settings > Devices & services > Apex Neptune Monitor lists them), or delete them.
# The Outlets view has a few outputs; add a tile for each of yours. Only built-in cards are used.

title: Apex
views:
- title: Tank
  path: apex
  icon: mdi:fishbowl
  type: sections
  max_columns: 4
  dense_section_placement: true
  badges:
  - type: entity
    entity: binary_sensor.apex_alarm
    name: Alarm
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.apex_temp
    name: Temp
    show_name: true
  - type: entity
    entity: sensor.apex_ph
    name: pH
    show_name: true
  - type: entity
    entity: sensor.apex_salinity
    name: Salinity
    show_name: true
  - type: entity
    entity: sensor.apex_alkalinity
    name: Alk
    show_name: true
  - type: entity
    entity: sensor.apex_feed_mode
    name: Feed
    show_name: true
  - type: entity
    entity: sensor.apex_total_power
    name: Power
    show_name: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Water
      icon: mdi:waves
    - type: tile
      entity: sensor.apex_temp
      name: Temp
    - type: tile
      entity: sensor.apex_temp_2
      name: Temp 2
    - type: tile
      entity: sensor.apex_ph
      name: pH
    - type: tile
      entity: sensor.apex_ph_2
      name: pH 2
    - type: tile
      entity: sensor.apex_salinity
      name: Salinity
    - type: tile
      entity: sensor.apex_salinity_2
      name: Salinity 2
    - type: heading
      heading: Trident results
      heading_style: subtitle
    - type: tile
      entity: sensor.apex_alkalinity
      name: Alkalinity
      grid_options:
        columns: 4
      vertical: true
    - type: tile
      entity: sensor.apex_calcium
      name: Calcium
      grid_options:
        columns: 4
      vertical: true
    - type: tile
      entity: sensor.apex_magnesium
      name: Magnesium
      grid_options:
        columns: 4
      vertical: true
  - type: grid
    cards:
    - type: heading
      heading: Feed
      icon: mdi:fish
    - type: tile
      entity: sensor.apex_feed_mode
      name: Feed mode
    - type: tile
      entity: sensor.apex_feed_ends
      name: Ends
    - type: tile
      entity: button.apex_feed_a
      name: A
      icon: mdi:alpha-a-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_a
      icon_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_a
      hold_action:
        action: more-info
      grid_options:
        columns: 3
    - type: tile
      entity: button.apex_feed_b
      name: B
      icon: mdi:alpha-b-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_b
      icon_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_b
      hold_action:
        action: more-info
      grid_options:
        columns: 3
    - type: tile
      entity: button.apex_feed_c
      name: C
      icon: mdi:alpha-c-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_c
      icon_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_c
      hold_action:
        action: more-info
      grid_options:
        columns: 3
    - type: tile
      entity: button.apex_feed_d
      name: D
      icon: mdi:alpha-d-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_d
        confirmation:
          text: Start Feed D? This also runs the auto feeder.
      icon_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_feed_d
        confirmation:
          text: Start Feed D? This also runs the auto feeder.
      hold_action:
        action: more-info
      grid_options:
        columns: 3
    - type: tile
      entity: button.apex_cancel_feed
      name: Cancel feed
      icon: mdi:fish-off
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.apex_cancel_feed
      hold_action:
        action: more-info
      grid_options:
        columns: 12
  - type: grid
