name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: "ubuntu-latest"
    name: Attach apex.zip
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v4"

      - name: Build zip
        working-directory: custom_components/apex
        run: zip -r "$GITHUB_WORKSPACE/apex.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apex.zip --clobber
